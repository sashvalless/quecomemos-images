function chips(){document.getElementById('chips').innerHTML=['Todos',...T].map(t=>`<button class="chip ${t==tipo?'on':''}" data-t="${t}">${t=='Tipica'?'Típica':t}</button>`).join(' ')}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function draw(){const q=norm(document.getElementById('q').value);document.getElementById('grid').innerHTML=D.map((r,i)=>[r,i]).filter(([r])=>(tipo=='Todos'||r.t==tipo)&&norm(r.n+' '+r.t).includes(q)).map(([r,i])=>`<div class="card" data-i="${i}"><img loading="lazy" src="${r.i}" alt="${esc(r.n)}"><div><b>${esc(r.n)}</b><span>${r.t=='Tipica'?'Típica':r.t} · $${r.lo}–$${r.hi}</span></div></div>`).join('')}
function show(i){const r=D[i];document.getElementById('list').hidden=true;const m=document.getElementById('menu');m.hidden=false;
m.innerHTML=`<button class="back">← Volver</button><h2>${esc(r.n)}</h2><p style="color:#6B645C">${esc(r.dir)}</p><div class="dishes">${r.m.map(d=>`<div><img loading="lazy" src="${d.i}" alt="${esc(d.n)}"><small>${esc(d.n)} · $${d.p.toFixed(2)}</small></div>`).join('')}</div>`;
m.querySelector('.back').onclick=()=>{m.hidden=true;document.getElementById('list').hidden=false};scrollTo(0,0)}
document.getElementById('chips').onclick=e=>{if(e.target.dataset.t){tipo=e.target.dataset.t;chips();draw()}};
document.getElementById('q').oninput=draw;
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.card');if(c)show(+c.dataset.i)};
chips();draw();
</script></body></html>
